name: galla
description: Daily business ledger for small shops — record money in and out like a khata.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  drift: ^2.28.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  image_picker: ^1.2.0
  speech_to_text: ^7.3.0
  local_auth: ^2.3.0
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^11.1.0
  flutter_local_notifications: ^19.4.1
  crypto: ^3.0.6
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/galla_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
